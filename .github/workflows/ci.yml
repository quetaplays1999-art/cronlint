name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite
        run: npm test

      - name: CLI smoke check
        run: |
          node ./bin/cronlint.js --version
          node ./bin/cronlint.js validate "*/15 9-17 * * MON-FRI" --json
          node ./bin/cronlint.js explain "0 9 * * MON-FRI"
          node ./bin/cronlint.js next "@daily" --count 3 --from 2026-01-01T00:00:00Z
